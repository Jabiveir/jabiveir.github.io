<!DOCTYPE html>
<html>
  <head>
    <title>Five Nights at Jabiveir's</title>
    <meta charset="UTF-8">
    <meta name="robots" content="none">
    <style>
      #GameScreen{
        border:2px solid #000;
        padding:0;
        margin:auto;
        display:block;
        width:640px
      } body {background-color:#363636}
    </style>
  </head>
  <body>
    <canvas id="GameScreen" width="640" height="480" style="user-select: none;"></canvas>
    <script type="module">
      class buttons {
        constructor() {
          this.B = [];
        }
        NewButton(X, Y, W, H, ShowVar, GoalVar, Vis, Text, TextSize, Type) {
          let Button = {
            X,
            Y,
            W,
            H,
            ShowVar,
            GoalVar,
            Vis,
            Text,
            TextSize,
            Type
          };
          this.B.push(Button);
        }
      };

      class Game {
        constructor(Ctx, GameData, Menu, Buttons, Images) {
          GameData.Playing = true;
          window.onerror = function () {
            GameData.Playing = false;
          };
          var limitLoop = function (fn) {
            var then = new Date().getTime();
            var interval = 1000 / 60;
            return (function loop(time) {
              requestAnimationFrame(loop);
              var now = new Date().getTime();
              var delta = now - then;
              if (delta > interval) {
                then = now - (delta % interval);
                if (GameData.Playing) GameLoop();
              }
            })(0);
          };
          function GameLoop() {
            Ctx.clearRect(0, 0, 640, 480);
            Ctx.fillStyle = "#000";
            Ctx.fillRect(0, 0, 640, 480);
            GameData.Time += 1;
            if (GameData.Time >= 21600 / GameData.FastNights && !GameData.Endless) {
              GameData.Waiting = true;
              GameData.Time = 0;
              GameData.Night += 1;
            }
            if (GameData.Waiting) {
              Ctx.fillStyle = "#000";
              Ctx.fillRect(0, 0, 640, 480);
              Ctx.fillStyle = "#fff";
              Ctx.font = "100px sans-serif ";
              if (GameData.Time < 300) {
                Ctx.fillText("6 AM", 320, 250);
              } else if (GameData.Time < 420) {
                if (GameData.Night === 7 && !GameData.CustomNight) {
                  GameData.Time = 305;
                  Ctx.font = "60px sans-serif";
                  Ctx.fillText("You beat the game!", 320, 180);
                  Ctx.font = "30px sans-serif";
                  Ctx.fillText("Good job!", 320, 260);
                  let d = new Date();
                  d.setTime(d.getTime() + 365 * 24 * 60 * 60 * 1000);
                  document.cookie = "FNaJCustom=1010100;expires=" + d.toUTCString() + ";path=/";
                  let Ach;
                  let name = "Ach=";
                  let ca = decodeURIComponent(document.cookie).split(";");
                  for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === " ") {c = c.substring(1);}
                    if (c.indexOf(name) === 0) Ach = c.substring(name.length, c.length);
                  }
                  if(!!Ach && Ach[11] === "0") {
                    Ach = Ach.slice(0, 11) + "1" + Ach.slice(11+1);
                    document.cookie = "Ach=" + Ach + ";expires=" + d.toUTCString() + ";path=/";
                    alert("Achievement unlocked!\n'Paycheck'");
                  }
                } else if (GameData.Night === 8) {
                  GameData.Time = 305;
                  Ctx.font = "60px sans-serif";
                  Ctx.fillText("You beat night 7!", 320, 180);
                  Ctx.font = "30px sans-serif";
                  Ctx.fillText(
                    "on " +
                      GameData.FearFactor +
                      "/" +
                      GameData.JabiDiff +
                      "/" +
                      GameData.VirusDiff +
                      " mode!",
                    320,
                    220
                  );
                  /*let Cheats =
                    +GameData.NoFrontalLobe +
                    +GameData.BackupGenerator +
                    (GameData.FastNights - 1);
                  let Challenges =
                    +GameData.Blind +
                    (GameData.DoubleJabi - 1) +
                    (2 - GameData.DoubleVirus);
                  Ctx.fillText(
                    "You used " +
                      Cheats +
                      " cheats and " +
                      Challenges +
                      " challenges!",
                    320,
                    260
                  );*/

                  let Ach;
                  let name = "Ach=";
                  let ca = decodeURIComponent(document.cookie).split(";");
                  for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === " ") {c = c.substring(1);}
                    if (c.indexOf(name) === 0) Ach = c.substring(name.length, c.length);
                  }
                  if(GameData.FearFactor === 20 && GameData.JabiDiff === 20 && GameData.VirusDiff === 20 && !!Ach && Ach[12] === "0") {
                    Ach = Ach.slice(0, 12) + "1" + Ach.slice(12+1);
                    let d = new Date();
                    d.setTime(d.getTime() + 365 * 24 * 60 * 60 * 1000);
                    document.cookie = "Ach=" + Ach + ";expires=" + d.toUTCString() + ";path=/";
                    alert("Achievement unlocked!\n'Pink Slip'");
                  }
                } else Ctx.fillText("Night " + GameData.Night, 320, 250);
              } else {
                GameData.Time = 0;
                GameData.Waiting = false;
                let d = new Date();
                d.setTime(d.getTime() + 365 * 24 * 60 * 60 * 1000);
                if (GameData.Night < 7)
                  document.cookie =
                    "FNaJNight=" +
                    GameData.Night +
                    ";expires=" +
                    d.toUTCString() +
                    ";path=/";
                GameData.JabiTimer = {
                  Door: -1,
                  Closet: -1,
                  Window: -1
                };
                GameData.Sprites = {
                  Door: "Room",
                  Closet: "Room",
                  Window: "Room"
                };
                GameData.FlashesLeft = 90 / GameData.FastNights;
                GameData.Fear = 0;
                GameData.Status = "AliveRoom";
                if (GameData.Night < 7) {
                  GameData.FearFactor = GameData.Night * 2;
                  GameData.JabiDiff = GameData.Night * 2.5;
                  GameData.VirusDiff = GameData.Night * 2;
                }
              }
            } else {
              if (GameData.MenuVar === 3) GameData.MenuVar = 4;
              if (GameData.Status === "AliveRoom") {
                if (
                  GameData.Time - GameData.JabiTimer.Door >=
                  GameData.AnimationTime
                ) {
                  if (GameData.Sprites.Door === "RoomJabi1") {
                    GameData.Sprites.Door = "RoomJabi2";
                    GameData.JabiTimer.Door = GameData.Time;
                  } else if (GameData.Sprites.Door === "RoomJabi2") {
                    GameData.Sprites.Door = "RoomFlash";
                    GameData.JabiTimer.Door = -1;
                  }
                }
                if (
                  GameData.Time - GameData.JabiTimer.Closet >=
                  GameData.AnimationTime
                ) {
                  if (GameData.Sprites.Closet === "RoomJabi1") {
                    GameData.Sprites.Closet = "RoomJabi2";
                    GameData.JabiTimer.Closet = GameData.Time;
                  } else if (GameData.Sprites.Closet === "RoomJabi2") {
                    GameData.Sprites.Closet = "RoomFlash";
                    GameData.JabiTimer.Closet = -1;
                  }
                }
                if (
                  GameData.Time - GameData.JabiTimer.Window >=
                  GameData.AnimationTime
                ) {
                  if (GameData.Sprites.Window === "RoomJabi1") {
                    GameData.Sprites.Window = "RoomJabi2";
                    GameData.JabiTimer.Window = GameData.Time;
                  } else if (GameData.Sprites.Window === "RoomJabi2") {
                    GameData.Sprites.Window = "RoomFlash";
                    GameData.JabiTimer.Window = -1;
                  }
                }
                if (!GameData.Blind) {
                  Ctx.drawImage(
                    eval("Images." + GameData.Sprites.Door),
                    0,
                    0,
                    168,
                    480,
                    0,
                    0,
                    168,
                    480
                  );
                  Ctx.drawImage(
                    eval("Images." + GameData.Sprites.Closet),
                    168,
                    0,
                    332,
                    480,
                    168,
                    0,
                    332,
                    480
                  );
                  Ctx.drawImage(
                    eval("Images." + GameData.Sprites.Window),
                    500,
                    0,
                    140,
                    480,
                    500,
                    0,
                    140,
                    480
                  );
                }
              } else if (GameData.Status === "AliveComputer") {
                if (!GameData.Blind) {
                  Ctx.drawImage(Images.Computer, 0, 0);
                  Ctx.drawImage(
                    Images.CompAnims[GameData.CompAnim][
                      ((GameData.Time / GameData.AnimationTime / 2) % 4) -
                        ((GameData.Time / GameData.AnimationTime / 2) % 1)
                    ],
                    64,
                    96
                  );
                }
                if (GameData.MenuVar === 8)
                  Menu.UpdateMenu(Ctx, Buttons, GameData, Images, true, 0);
                GameData.Fear -= GameData.Fear % 1;
                if (GameData.Fear > 0) GameData.Fear -= 2 / 3;
              } else if (GameData.Status === "Dying1") {
                Ctx.drawImage(Images.RoomDeath1, 0, 0);
                if (GameData.Time > GameData.AnimationTime) {
                  GameData.Time = 0;
                  GameData.Status = "Dying2";
                }
              } else if (GameData.Status === "Dying2") {
                Ctx.drawImage(Images.RoomDeath2, 0, 0);
                if (GameData.Time > GameData.AnimationTime) {
                  GameData.Time = 0;
                  GameData.Status = "Dying3";
                }
              } else if (GameData.Status === "Dying3") {
                Ctx.drawImage(Images.RoomDeath3, 0, 0);
                if (GameData.Time > GameData.AnimationTime) {
                  GameData.Time = 256;
                  GameData.MenuVar = 6;
                  GameData.Status = "Dead";
                }
              } else if (GameData.Status === "Dead") {
                GameData.Time -= 1;
                if (GameData.Time > 0) GameData.Time -= 1;
                Ctx.fillStyle = "#0f0";
                Ctx.fillRect(0, 0, 640, 480);
                var Color = GameData.Time.toString(16);
                if (Color.length === 1) Color = "0" + Color;
                Ctx.fillStyle = "#00" + Color + "00";
                Ctx.textAlign = "center";
                Ctx.font = "60px sans-serif";
                Ctx.fillText("You died!", 320, 150);
                Ctx.font = "30px sans-serif";
                if (GameData.DeathReason === "Eyes") {
                  Ctx.fillText(
                    "If you see eyes, flash your light at them!",
                    320,
                    200
                  );
                  Ctx.fillText("If they're unusually bright, they may", 320, 235);
                  Ctx.fillText("just be hallucinations.", 320, 270);
                }
                if (GameData.DeathReason === "Fear") {
                  Ctx.fillText("Jabiveir can smell fear, so if your", 320, 200);
                  Ctx.fillText("fear meter reaches max, you'll die.", 320, 235);
                  Ctx.fillText("Look on your computer to calm down.", 320, 270);
                }
                if (GameData.Endless) {
                  Ctx.fillText(
                    Math.floor(GameData.EndTime / 60) +
                      ":" +
                      (GameData.EndTime % 60) +
                      " on " +
                      GameData.FearFactor +
                      "/" +
                      GameData.JabiDiff +
                      "/" +
                      GameData.VirusDiff +
                      " mode.",
                    320,
                    310
                  );
                  let Cheats =
                    +GameData.NoFrontalLobe +
                    +GameData.BackupGenerator +
                    (GameData.FastNights - 1);
                  let Challenges =
                    +GameData.Blind +
                    (GameData.DoubleJabi - 1) +
                    (2 - GameData.DoubleVirus);
                  Ctx.fillText(
                    "You used " +
                      Cheats +
                      " cheats and " +
                      Challenges +
                      " challenges.",
                    320,
                    345
                  );
                }
              
                Ctx.fillText("Refresh to continue", 320, 400);
              }
              if (
                GameData.Status === "AliveRoom" ||
                GameData.Status === "AliveComputer"
              ) {
                if (GameData.Fear < 100) {
                  if (!GameData.NoFrontalLobe)
                    GameData.Fear += GameData.FearFactor / 60;
                } else {
                  GameData.Status = "Dying1";
                  GameData.EndTime = Math.floor(GameData.Time / 60);
                  GameData.Time = 0;
                  GameData.DeathReason = "Fear";
                  GameData.MenuVar = 7;
                }
                Ctx.fillStyle = "#fff";
                Ctx.font = "40px sans-serif ";
                var Hour =
                  (GameData.Time - (GameData.Time % (3600 / GameData.FastNights))) /
                  (3600 / GameData.FastNights);
                if (Hour === 0) Hour = 12;
                Ctx.textAlign = "left";
                Ctx.fillText(Hour, 544.5 - Ctx.measureText(Hour).width, 50);
                Ctx.fillText("AM", 555, 50);
              
                Ctx.font = "20px sans-serif ";
                Ctx.fillText("Power", 32, 470);
                Ctx.fillRect(100, 410, 7, 30);
                Ctx.fillRect(20, 400, 80, 50);
                Ctx.fillStyle = "#000";
                Ctx.fillRect(25, 405, 70, 40);
                Ctx.fillStyle = "#fff";
                if (!GameData.Blind) {
                  if (GameData.Status === "AliveRoom")
                    Ctx.drawImage(Images.Room, 25, 405, 70, 40, 25, 405, 70, 40);
                  else if (GameData.Status === "AliveComputer")
                    Ctx.drawImage(Images.Computer, 25, 405, 70, 40, 25, 405, 70, 40);
                }
                Ctx.fillRect(
                  30,
                  410,
                  ((GameData.FlashesLeft * 2) / 3) * GameData.FastNights,
                  30
                );
              
                Ctx.font = "20px sans-serif ";
                Ctx.fillText("Fear", 540, 470);
                Ctx.fillRect(500, 400, 120, 50);
                Ctx.textAlign = "center";
                Ctx.fillStyle = "#000";
                Ctx.fillRect(505, 405, 110, 40);
                Ctx.fillStyle = "#fff";
                if (!GameData.Blind) {
                  if (GameData.Status === "AliveRoom")
                    Ctx.drawImage(Images.Room, 505, 405, 110, 40, 505, 405, 110, 40);
                  else if (GameData.Status === "AliveComputer")
                    Ctx.drawImage(
                      Images.Computer,
                      505,
                      405,
                      110,
                      40,
                      505,
                      405,
                      110,
                      40
                    );
                }
                var Red = (
                  GameData.Fear / (100 / 255) -
                  ((GameData.Fear / (100 / 255)) % 1)
                ).toString(16);
                if (Red.length === 1) Red = "0" + Red;
                var Green = (
                  255 -
                  (GameData.Fear / (100 / 255) - ((GameData.Fear / (100 / 255)) % 1))
                ).toString(16);
                if (Green.length === 1) Green = "0" + Green;
                Ctx.fillStyle = "#" + Red + Green + "00";
                Ctx.fillRect(510, 410, GameData.Fear, 30);
              
                if (GameData.Time % 180 === 0 && GameData.Time !== 0) {
                  if (GameData.Fear / 100 > Math.random()) {
                    var Spot = Math.floor(Math.random() * 3) + 1;
                    if (Spot === 1 && GameData.Sprites.Door !== "RoomEyes") {
                      GameData.Sprites.Door = "RoomHallucinations";
                      GameData.JabiTimer.Door = GameData.Time;
                    } else if (Spot === 2 && GameData.Sprites.Close !== "RoomEyes") {
                      GameData.Sprites.Closet = "RoomHallucinations";
                      GameData.JabiTimer.Closet = GameData.Time;
                    } else if (Spot === 3 && GameData.Sprites.Window !== "RoomEyes") {
                      GameData.Sprites.Window = "RoomHallucinations";
                      GameData.JabiTimer.Window = GameData.Time;
                    }
                  }
                }
                if (
                  GameData.Time % (360 / GameData.DoubleJabi) === 0 &&
                  GameData.Time !== 0
                ) {
                  if (GameData.JabiDiff / 20 > Math.random()) {
                    var Spot = Math.floor(Math.random() * 3) + 1;
                    if (Spot === 1) {
                      GameData.Sprites.Door = "RoomEyes";
                      GameData.JabiTimer.Door = GameData.Time;
                    } else if (Spot === 2) {
                      GameData.Sprites.Closet = "RoomEyes";
                      GameData.JabiTimer.Closet = GameData.Time;
                    } else if (Spot === 3) {
                      GameData.Sprites.Window = "RoomEyes";
                      GameData.JabiTimer.Window = GameData.Time;
                    }
                  }
                }
                if (
                  (GameData.Time >
                    GameData.JabiTimer.Door + 360 / GameData.DoubleJabi &&
                    GameData.Sprites.Door === "RoomEyes") ||
                  (GameData.Time >
                    GameData.JabiTimer.Closet + 360 / GameData.DoubleJabi &&
                    GameData.Sprites.Closet === "RoomEyes") ||
                  (GameData.Time >
                    GameData.JabiTimer.Window + 360 / GameData.DoubleJabi &&
                    GameData.Sprites.Window === "RoomEyes")
                ) {
                  GameData.Status = "Dying1";
                  GameData.EndTime = Math.floor(GameData.Time / 60);
                  GameData.Time = 0;
                  GameData.DeathReason = "Eyes";
                  GameData.MenuVar = 7;
                }
                if (
                  GameData.Time > GameData.JabiTimer.Door + 360 &&
                  GameData.Sprites.Door === "RoomHallucinations"
                ) {
                  GameData.Sprites.Door = "Room";
                  GameData.JabiTimer.Door = -1;
                }
                if (
                  GameData.Time > GameData.JabiTimer.Closet + 360 &&
                  GameData.Sprites.Closet === "RoomHallucinations"
                ) {
                  GameData.Sprites.Closet = "Room";
                  GameData.JabiTimer.Closet = -1;
                }
                if (
                  GameData.Time > GameData.JabiTimer.Window + 360 &&
                  GameData.Sprites.Window === "RoomHallucinations"
                ) {
                  GameData.Sprites.Window = "Room";
                  GameData.JabiTimer.Window = -1;
                }
              }
            }
          }
          limitLoop(GameLoop);
        }
      };


      class menu {
        UpdateMenu(Ctx, Buttons, GameData, Images, DontClear, ButtonClicked) {
          if (DontClear !== true) {
            Ctx.clearRect(0, 0, 640, 480);
            Ctx.textAlign = "center";
            if (GameData.MenuVar > 1) {
              Ctx.fillStyle = "#000";
              Ctx.fillRect(0, 0, 640, 480);
            }
          }
          if (GameData.MenuVar === 0) {
            Ctx.font = "30px sans-serif ";
            Ctx.fillText("Save wiped", 320, 347, 200);
            Ctx.fillText("Refresh to undo", 320, 377, 200);
            GameData.MenuVar = 1;
            GameData.Night = 1;
            Buttons.B[0].Text = "Night 1";
            if(Buttons.B[29].Text === "Custom Night") Buttons.B[29].X = 2000;
          }
          if (GameData.MenuVar === -2) {
            if (Buttons.B[ButtonClicked].Text === "<") {
              if (GameData.Volume > 0) GameData.Volume -= 5;
            } else if (Buttons.B[ButtonClicked].Text === ">") {
              if (GameData.Volume < 100) GameData.Volume += 5;
            } else {
              if (
                Buttons.B[ButtonClicked].Vis === "Menu" &&
                Buttons.B[ButtonClicked].Text !== "Settings"
              ) {
                Buttons.B[ButtonClicked].Vis = "Active";
                if (Buttons.B[ButtonClicked].Type === "NoFrontalLobe")
                  GameData.NoFrontalLobe = true;
                if (Buttons.B[ButtonClicked].Type === "BackupGenerator")
                  GameData.BackupGenerator = true;
                if (Buttons.B[ButtonClicked].Type === "FastNights")
                  GameData.FastNights = 2;
                if (Buttons.B[ButtonClicked].Type === "Blind") GameData.Blind = true;
                if (Buttons.B[ButtonClicked].Type === "DoubleJabi")
                  GameData.DoubleJabi = 2;
                if (Buttons.B[ButtonClicked].Type === "DoubleVirus")
                  GameData.DoubleVirus = 1;
              } else if (Buttons.B[ButtonClicked].Vis === "Active") {
                Buttons.B[ButtonClicked].Vis = "Menu";
                if (Buttons.B[ButtonClicked].Type === "NoFrontalLobe")
                  GameData.NoFrontalLobe = false;
                if (Buttons.B[ButtonClicked].Type === "BackupGenerator")
                  GameData.BackupGenerator = false;
                if (Buttons.B[ButtonClicked].Type === "FastNights")
                  GameData.FastNights = 1;
                if (Buttons.B[ButtonClicked].Type === "Blind") GameData.Blind = false;
                if (Buttons.B[ButtonClicked].Type === "DoubleJabi")
                  GameData.DoubleJabi = 1;
                if (Buttons.B[ButtonClicked].Type === "DoubleVirus")
                  GameData.DoubleVirus = 2;
              }
            }
            var BinVol = GameData.Volume.toString(2);
            while (BinVol.length < 7) BinVol = "0" + BinVol;
          
            let d = new Date();
            d.setTime(d.getTime() + 365 * 24 * 60 * 60 * 1000);
            document.cookie =
              "FNaJSettings=" +
              BinVol +
              +GameData.NoFrontalLobe +
              +GameData.BackupGenerator +
              (GameData.FastNights - 1) +
              +GameData.Blind +
              (GameData.DoubleJabi - 1) +
              (2 - GameData.DoubleVirus) +
              ";expires=" +
              d.toUTCString() +
              ";path=/";
          
            Ctx.fillStyle = "#000";
            Ctx.font = "60px sans-serif ";
            Ctx.fillText("Settings", 320, 55);
            Ctx.fillRect(0, 70, 640, 5);
            Ctx.fillRect(318, 70, 4, 410);
            Ctx.fillText("Cheats", 160, 125);
            Ctx.fillText("Challenges", 480, 125);
            Ctx.font = "40px sans-serif ";
            Ctx.textAlign = "left";
            Ctx.fillText("Courageous", 50, 190, 260);
            Ctx.fillText("Backup Generator", 50, 280, 260);
            Ctx.fillText("Fast Nights", 50, 370, 260);
            Ctx.fillText("Blindness", 372, 190, 260);
            Ctx.fillText("Double Jabiveir", 372, 280, 260);
            Ctx.fillText("Double JabiVirus", 372, 370, 260);
            Ctx.font = "20px sans-serif ";
            Ctx.textAlign = "center";
            Ctx.fillText("Prevents fear from increasing", 160, 215, 300);
            Ctx.fillText("Prevents power from decreasing", 160, 305, 300);
            Ctx.fillText("Makes nights last half as long", 160, 395, 300);
            Ctx.fillText("(Halves total available power)", 160, 415, 300);
            Ctx.fillText("Only displays the HUD", 480, 215, 300);
            Ctx.fillText("(Disables getting JabiVirus)", 480, 235, 300);
            Ctx.fillText("Doubles how often eyes appear", 480, 305, 300);
            Ctx.fillText("(Halves flashlight power usage)", 480, 325, 300);
            Ctx.fillText("Doubles amount of buttons to press", 480, 395, 300);
          }
          if (GameData.MenuVar === -3) {
            if (Buttons.B[ButtonClicked].Type === "Endless") {
              if (Buttons.B[ButtonClicked].Vis === "Menu") {
                Buttons.B[ButtonClicked].Vis = "Active";
                GameData.Endless = true;
              } else {
                Buttons.B[ButtonClicked].Vis = "Menu";
                GameData.Endless = false;
              }
            } else if (Buttons.B[ButtonClicked].Text === ">") {
              if (eval("GameData." + Buttons.B[ButtonClicked].Type) < 20) {
                eval("GameData." + Buttons.B[ButtonClicked].Type + " += 1");
              }
            } else if (Buttons.B[ButtonClicked].Text === "<") {
              if (eval("GameData." + Buttons.B[ButtonClicked].Type) > 0) {
                eval("GameData." + Buttons.B[ButtonClicked].Type + " -= 1");
              }
              if (GameData.FearFactor < 1) GameData.FearFactor = 1;
            }
            let d = new Date();
            d.setTime(d.getTime() + 365 * 24 * 60 * 60 * 1000);
            document.cookie =
              "FNaJCustom=" +
              (GameData.FearFactor + 10) +
              "" +
              (GameData.JabiDiff + 10) +
              "" +
              (GameData.VirusDiff + 10) +
              "" +
              (+GameData.Endless) +
              ";expires=" +
              d.toUTCString() +
              ";path=/";
            Ctx.fillStyle = "#000";
            Ctx.font = "60px sans-serif ";
            Ctx.fillText("Custom Night", 320, 55);
            Ctx.fillRect(0, 70, 640, 5);
            Ctx.fillText(GameData.FearFactor, 100, 128);
            Ctx.fillText(GameData.JabiDiff, 100, 208);
            Ctx.fillText(GameData.VirusDiff, 100, 288);
            Ctx.textAlign = "left";
            Ctx.fillText("Fear Factor", 200, 128);
            Ctx.fillText("Jabiveir", 200, 208);
            Ctx.fillText("JabiVirus", 200, 288);
            Ctx.fillRect(0, 300, 640, 5);
            Ctx.fillText("Endless Mode", 70, 363);
            Ctx.fillRect(0, 380, 640, 5);
            Ctx.textAlign = "center";
          }
          for (let i = 0; i < Buttons.B.length; i++) {
            if (GameData.MenuVar === Buttons.B[i].ShowVar) {
              if (Buttons.B[i].Vis === "Menu") {
                Ctx.fillStyle = "#000";
                Ctx.fillRect(
                  Buttons.B[i].X,
                  Buttons.B[i].Y,
                  Buttons.B[i].W,
                  Buttons.B[i].H

                Ctx.fillStyle = "#fff";
                Ctx.fillRect(
                  Buttons.B[i].X + 2,
                  Buttons.B[i].Y + 2,
                  Buttons.B[i].W - 4,
                  Buttons.B[i].H - 4
                );
                Ctx.fillStyle = "#000";
                Ctx.font = Buttons.B[i].TextSize + "px sans-serif ";
                Ctx.fillText(
                  Buttons.B[i].Text,
                  Buttons.B[i].X + Buttons.B[i].W / 2,
                  Buttons.B[i].Y + Buttons.B[i].H / 2 + Buttons.B[i].TextSize / 2.5,
                  Buttons.B[i].W
                );
              } else if (Buttons.B[i].Vis === "Active") {
                Ctx.fillStyle = "#000";
                Ctx.fillRect(
                  Buttons.B[i].X,
                  Buttons.B[i].Y,
                  Buttons.B[i].W,
                  Buttons.B[i].H
                );
                Ctx.fillStyle = "#fff";
                Ctx.fillRect(
                  Buttons.B[i].X + 2,
                  Buttons.B[i].Y + 2,
                  Buttons.B[i].W - 4,
                  Buttons.B[i].H - 4
                );
                Ctx.fillStyle = "#000";
                Ctx.fillRect(
                  Buttons.B[i].X + 6,
                  Buttons.B[i].Y + 6,
                  Buttons.B[i].W - 12,
                  Buttons.B[i].H - 12
                );
              }
            }
          }
          if (GameData.MenuVar === 1) {
            Ctx.fillStyle = "#000";
            Ctx.font = "50px sans-serif ";
            Ctx.fillText("Five Nights at Jabiveir's", 320, 180);
            Ctx.font = "20px sans-serif";
            Ctx.textAlign = "left";
            Ctx.fillText("Version 1.3", 5, 475);
            Ctx.textAlign = "center";
            for(let i = 0; i < GameData.Stars; i++) {
              Ctx.drawImage(Images.Star, 10 + 36*i, 10, 32, 32);
            }
          }
          if (GameData.MenuVar === 2) {
            if (Buttons.B[ButtonClicked].Type === "CN") {
              GameData.CustomNight = true;
              GameData.Night = 7;
            }
            if(GameData.Night === 1) document.cookie = "FNaJCustom=0;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            new Game(Ctx, GameData, this, Buttons, Images);
            GameData.MenuVar = 3;
          }
          if (GameData.MenuVar === 4) {
            if (!GameData.BackupGenerator)
              GameData.FlashesLeft -= 1 / GameData.DoubleJabi;
            if (GameData.PressedType === "Computer") {
              GameData.Status = "AliveRoom";
              if (!GameData.BackupGenerator)
                GameData.FlashesLeft += 1 / GameData.DoubleJabi;
              GameData.VirusSolved = false;
            } else {
              var Temp = "";
              if (
                (eval("GameData.Sprites." + GameData.PressedType) === "Room" ||
                  eval("GameData.Sprites." + GameData.PressedType) ===
                    "RoomHallucinations") &&
                GameData.FlashesLeft >= 0
              ) {
                Temp = "RoomFlash";
              } else if (
                eval("GameData.Sprites." + GameData.PressedType) === "RoomEyes" &&
                GameData.FlashesLeft >= 0
              ) {
                Temp = "RoomJabi1";
                eval(
                  "GameData.JabiTimer." + GameData.PressedType + " = GameData.Time"
                );
              } else {
                if (!GameData.BackupGenerator)
                  GameData.FlashesLeft += 1 / GameData.DoubleJabi;
              }
              if (
                GameData.Sprites.Door === "RoomFlash" ||
                GameData.Sprites.Door === "RoomJabi1" ||
                GameData.Sprites.Door === "RoomJabi2"
              ) {
                GameData.Sprites.Door = "Room";
                GameData.JabiTimer.Door = -1;
              }
              if (
                GameData.Sprites.Closet === "RoomFlash" ||
                GameData.Sprites.Closet === "RoomJabi1" ||
                GameData.Sprites.Closet === "RoomJabi2"
              ) {
                GameData.Sprites.Closet = "Room";
                GameData.JabiTimer.Closet = -1;
              }
              if (
                GameData.Sprites.Window === "RoomFlash" ||
                GameData.Sprites.Window === "RoomJabi1" ||
                GameData.Sprites.Window === "RoomJabi2"
              ) {
                GameData.Sprites.Window = "Room";
                GameData.JabiTimer.Window = -1;
              }
              if (Temp !== "") {
                eval("GameData.Sprites." + GameData.PressedType + " = Temp");
              }
            }
          }
          if (GameData.MenuVar === 5) {
            if (GameData.FlashesLeft > 0) {
              if (
                GameData.Sprites.Door === "RoomFlash" ||
                GameData.Sprites.Door === "RoomJabi1" ||
                GameData.Sprites.Door === "RoomJabi2"
              ) {
                GameData.Sprites.Door = "Room";
                GameData.JabiTimer.Door = -1;
              }
              if (
                GameData.Sprites.Closet === "RoomFlash" ||
                GameData.Sprites.Closet === "RoomJabi1" ||
                GameData.Sprites.Closet === "RoomJabi2"
              ) {
                GameData.Sprites.Closet = "Room";
                GameData.JabiTimer.Closet = -1;
              }
              if (
                GameData.Sprites.Window === "RoomFlash" ||
                GameData.Sprites.Window === "RoomJabi1" ||
                GameData.Sprites.Window === "RoomJabi2"
              ) {
                GameData.Sprites.Window = "Room";
                GameData.JabiTimer.Window = -1;
              }
              GameData.Status = "AliveComputer";
              GameData.CompAnim = Math.floor(Math.random() * 4);
              if (!GameData.BackupGenerator) GameData.FlashesLeft -= 1;
              if (
                GameData.VirusDiff / 20 > Math.random() &&
                !GameData.VirusSolved &&
                !GameData.Blind
              ) {
                for (let i = 1; i <= GameData.VirusDiff / GameData.DoubleVirus; i++) {
                  var Colliding = true;
                  while (Colliding) {
                    Buttons.B[i + 6].X = Math.floor(Math.random() * 462) + 64;
                    Buttons.B[i + 6].Y = Math.floor(Math.random() * 238) + 96;
                    if (
                      !(
                        Buttons.B[i + 6].X + 50 > 320 - 86.89 &&
                        Buttons.B[i + 6].X < 320 - 86.89 + 173.78 &&
                        Buttons.B[i + 6].Y < 96 + 66
                      )
                    ) {
                      Colliding = false;
                      for (let j = 1; j < i; j++) {
                        if (
                          Buttons.B[i + 6].X + 50 > Buttons.B[j + 6].X &&
                          Buttons.B[i + 6].X < Buttons.B[j + 6].X + 50 &&
                          Buttons.B[i + 6].Y + 50 > Buttons.B[j + 6].Y &&
                          Buttons.B[i + 6].Y < Buttons.B[j + 6].Y + 50
                        )
                          Colliding = true;
                      }
                    }
                  }
                  Buttons.B[i + 6].ShowVar = 8;
                  Buttons.B[i + 6].Vis = "Menu";
                }
                GameData.ButtonsClicked = 0;
                GameData.MenuVar = 8;
              }
            } else {
              GameData.MenuVar = 4;
            }
          }
          if (GameData.MenuVar === 8) {
            Ctx.font = "40px sans-serif";
            Ctx.fillStyle = "#000";
            Ctx.fillRect(320 - 86.89, 96, 173.78, 66);
            Ctx.fillStyle = "#fff";
            Ctx.fillRect(322 - 86.89, 98, 169.78, 62);
            Ctx.fillStyle = "#000";
            Ctx.fillText("JabiVirus", 320, 133);
            Ctx.font = "20px sans-serif";
            Ctx.fillText("Click buttons in order", 320, 155, 167.78);
            if (ButtonClicked !== 0) {
              if (Buttons.B[ButtonClicked].Text === GameData.ButtonsClicked + 1) {
                Buttons.B[ButtonClicked].Vis = "Clicked";
                GameData.ButtonsClicked += 1;
              } else {
                for (let i = 1; i <= GameData.ButtonsClicked; i++)
                  Buttons.B[i + 6].Vis = "Menu";
                GameData.ButtonsClicked = 0;
              }
              if (
                GameData.ButtonsClicked >=
                Math.floor(GameData.VirusDiff / GameData.DoubleVirus)
              ) {
                GameData.MenuVar = 5;
                GameData.VirusSolved = true;
              }
            }
          }
          if (GameData.MenuVar === -1) {
            Ctx.fillStyle = "#fff";
            Ctx.font = "60px sans-serif ";
            Ctx.fillText("Tutorial", 320, 55);
            Ctx.fillRect(0, 70, 640, 5);
            Ctx.font = "30px sans-serif ";
            Ctx.fillText("When eyes appear in your room, flash your", 320, 110);
            Ctx.fillText("light to make them go away; otherwise, Jabiveir", 320, 140);
            Ctx.fillText("will kill you. But if you're very scared, eyes", 320, 170);
            Ctx.fillText("may just be hallucinations. Jabiveir can also", 320, 200);
            Ctx.fillText("smell fear, so if your fear reaches maximum,", 320, 230);
            Ctx.fillText("Jabiveir will kill you. Going on your computer", 320, 260);
            Ctx.fillText("helps calm you down, but if you get malware,", 320, 290);
            Ctx.fillText("you will need to press buttons in numerical", 320, 320);
            Ctx.fillText("order to remove the virus. Flashing your light", 320, 350);
            Ctx.fillText("and going on your computer uses power, so", 320, 380);
            Ctx.fillText("you will be unable to use them if you run out.", 320, 410);
            Ctx.fillText("Survive until 6 AM to beat the night.", 320, 440);
          }
        }
      };


      class Input {
        constructor(Ctx, Buttons, GameData, Images) {
          let Menu = new menu();
          Menu.UpdateMenu(Ctx, Buttons, GameData, Images);
          let TouchEnabled = window.Touch || false;
          if(!TouchEnabled) {
            document.getElementById("GameScreen").addEventListener("click", (event) => {
              for (let i = 0; i < Buttons.B.length; i++) {
                if (GameData.MenuVar === Buttons.B[i].ShowVar) {
                  if (
                    event.offsetX > Buttons.B[i].X &&
                    event.offsetX < Buttons.B[i].X + Buttons.B[i].W &&
                    event.offsetY > Buttons.B[i].Y &&
                    event.offsetY < Buttons.B[i].Y + Buttons.B[i].H
                  ) {
                    GameData.MenuVar = Buttons.B[i].GoalVar;
                    if (Buttons.B[i].Vis !== "Menu")
                      GameData.PressedType = Buttons.B[i].Vis;
                    Menu.UpdateMenu(Ctx, Buttons, GameData, Images, false, i);
                    break;
                  }
                }
              }
            });
          } else {
            document.getElementById("GameScreen").addEventListener("touchstart", (event) => {
              //Thank you StackOverflow user rejnok for the touch equivalent to offsetX
              let bcr = event.target.getBoundingClientRect();
              let x = event.targetTouches[0].clientX - bcr.x;
              let y = event.targetTouches[0].clientY - bcr.y;
              for (let i = 0; i < Buttons.B.length; i++) {
                if (GameData.MenuVar === Buttons.B[i].ShowVar) {
                  if (
                    x > Buttons.B[i].X &&
                    x < Buttons.B[i].X + Buttons.B[i].W &&
                    y > Buttons.B[i].Y &&
                    y < Buttons.B[i].Y + Buttons.B[i].H
                  ) {
                    GameData.MenuVar = Buttons.B[i].GoalVar;
                    if (Buttons.B[i].Vis !== "Menu")
                      GameData.PressedType = Buttons.B[i].Vis;
                    Menu.UpdateMenu(Ctx, Buttons, GameData, Images, false, i);
                    break;
                  }
                }
              }
            });
          }
          
          if(TouchEnabled) {
            document.addEventListener("contextmenu", (e) => {
              e.preventDefault();
              e.stopPropagation();
              return false;
            });
            document.addEventListener("touchmove", (e) => {
              e.preventDefault();
            });
          }
        }
      };

      let Buttons = new buttons();

      let Canvas = document.getElementById("GameScreen");
      let Ctx = Canvas.getContext("2d");

      var Computer = document.createElement("img");
      Computer.src = "images/Computer.png";
      var Room = document.createElement("img");
      Room.src = "images/Room.png";
      var RoomEyes = document.createElement("img");
      RoomEyes.src = "images/RoomEyes.png";
      var RoomFlash = document.createElement("img");
      RoomFlash.src = "images/RoomFlash.png";
      var RoomHallucinations = document.createElement("img");
      RoomHallucinations.src = "images/RoomHallucinations.png";
      var RoomJabi1 = document.createElement("img");
      RoomJabi1.src = "images/RoomJabi1.png";
      var RoomJabi2 = document.createElement("img");
      RoomJabi2.src = "images/RoomJabi2.png";
      var RoomDeath1 = document.createElement("img");
      RoomDeath1.src = "images/RoomDeath1.png";

      RoomDeath2.src = "images/RoomDeath2.png";
      var RoomDeath3 = document.createElement("img");
      RoomDeath3.src = "images/RoomDeath3.png";
      var Brown1 = document.createElement("img");
      Brown1.src = "images/computer/Brown1.png";
      var Brown2 = document.createElement("img");
      Brown2.src = "images/computer/Brown2.png";
      var Brown3 = document.createElement("img");
      Brown3.src = "images/computer/Brown3.png";
      var Brown4 = document.createElement("img");
      Brown4.src = "images/computer/Brown4.png";
      var Grey1 = document.createElement("img");
      Grey1.src = "images/computer/Grey1.png";

      Grey2.src = "images/computer/Grey2.png";
      var Grey3 = document.createElement("img");
      Grey3.src = "images/computer/Grey3.png";
      var Grey4 = document.createElement("img");
      Grey4.src = "images/computer/Grey4.png";
      var Orange1 = document.createElement("img");
      Orange1.src = "images/computer/Orange1.png";
      var Orange2 = document.createElement("img");
      Orange2.src = "images/computer/Orange2.png";
      var Orange3 = document.createElement("img");
      Orange3.src = "images/computer/Orange3.png";
      var Orange4 = document.createElement("img");

      var White1 = document.createElement("img");

      let Images = {

        Room,
        RoomEyes,

        RoomJabi1,
        RoomJabi2,
        RoomDeath1,
        RoomDeath2,
        RoomDeath3,
        CompAnims: [
          [Brown1, Brown2, Brown3, Brown4],
          [Grey1, Grey2, Grey3, Grey4],
          [Orange1, Orange2, Orange3, Orange4],
          [White1, White2, White3, White4]
        ],
        Star
      };

      let GameData = {
        Playing: false,
        MenuVar: 1,
        Night: 1,
        Time: 300,
        Waiting: true,
        Status: "AliveRoom",
        PressedType: "",
        Sprites: {
          Door: "Room",
          Closet: "Room",
          Window: "Room"
        },
        JabiTimer: {
          Door: -1,
          Closet: -1,
          Window: -1
        },
        AnimationTime: 5,
        CompAnim: 0,
        FlashesLeft: 90,
        Fear: 0,
        FearFactor: 1,
        JabiDiff: 0,
        VirusDiff: 0,
        ButtonsClicked: 0,
        VirusSolved: false,
        DeathReason: "",
        Volume: 50,
        Blind: false,
        DoubleJabi: 1,
        DoubleVirus: 2,
        NoFrontalLobe: false,
        BackupGenerator: false,
        FastNights: 1,
        Endless: false,
        CustomNight: false,
        CustomUnlocked: false,
        EndTime: 0,
        Stars: 0
      };

      let decodedCookie = decodeURIComponent(document.cookie);
      let ca = decodedCookie.split(";");
      let Ach = 0;
      for (let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) === " ") {c = c.substring(1);}
        if (c.indexOf("FNaJNight=") === 0) GameData.Night = parseInt(c.substring(10), 10);
        if (c.indexOf("FNaJSettings=") === 0) {
          c = c.substring(13);
          GameData.Volume = parseInt(c.substring(0, 7), 2);
          GameData.NoFrontalLobe = !!parseInt(c.substring(7, 8), 2);
          GameData.BackupGenerator = !!parseInt(c.substring(8, 9), 2);
          GameData.FastNights = parseInt(c.substring(9, 10), 2) + 1;
          GameData.Blind = !!parseInt(c.substring(10, 11), 2);
          GameData.DoubleJabi = parseInt(c.substring(11, 12), 2) + 1;
          GameData.DoubleVirus = 2 - parseInt(c.substring(12, 13), 2);
        } if (c.indexOf("FNaJCustom=") === 0) {
          c = c.substring(11);
          GameData.FearFactor = parseInt(c.substring(0,2), 10) - 10;
          GameData.JabiDiff = parseInt(c.substring(2,4), 10) - 10;
          GameData.VirusDiff = parseInt(c.substring(4,6), 10) - 10;
          GameData.Endless = !!parseInt(c.substring(6,7), 10);
          GameData.CustomUnlocked = true;
        } if (c.indexOf("Ach=") === 0) {
          Ach = Number(c.substring(12+4,12+5));
        }
      }

      if(Ach === 1) GameData.Stars = 3;
      else if(GameData.CustomUnlocked) GameData.Stars = 2;
      else if(GameData.Night === 6) GameData.Stars = 1;

      Buttons.NewButton(
        220,
        200,

        1,
        2,
        "Menu",
        "Night " + GameData.Night,

      );

      Buttons.NewButton(235, 265, 170, 105, 4, 5, "Computer");
      Buttons.NewButton(0, 0, 640, 480, 5, 4, "Computer");
      for (let i = 1; i <= 20; i++)
        Buttons.NewButton(0, 0, 50, 50, 0, 8, "Menu", i, 40);
      Buttons.NewButton(0, 0, 640, 480, 8, 8, "VirusCountReset", "");

      Buttons.NewButton(455, 420, 175, 50, 1, -1, "Menu", "How To Play", 30);
      //Buttons.NewButton(505, 300, 125, 50, 1, -2, "Menu", "Settings", 30);
      if(GameData.CustomUnlocked)
        Buttons.NewButton(200, 290, 240, 75, 1, -3, "Menu", "Custom Night", 38);
      Buttons.NewButton(10, 10, 35, 35, -1, 1, "Menu", "X", 30);
      Buttons.NewButton(10, 10, 35, 35, -2, 1, "Menu", "X", 30);
      Buttons.NewButton(10, 10, 35, 35, -3, 1, "Menu", "X", 30);
      if (!GameData.NoFrontalLobe)
        Buttons.NewButton(10, 160, 30, 30, -2, -2, "Menu", "", 30, "NoFrontalLobe");
      else
        Buttons.NewButton(10, 160, 30, 30, -2, -2, "Active", "", 30, "NoFrontalLobe");
      if (!GameData.BackupGenerator)
        Buttons.NewButton(10, 250, 30, 30, -2, -2, "Menu", "", 30, "BackupGenerator");
      else
        Buttons.NewButton(
          10,
          250,
          30,
          30,
          -2,
          -2,
          "Active",
          "",
          30,
          "BackupGenerator"
        );
      if (GameData.FastNights === 1)
        Buttons.NewButton(10, 340, 30, 30, -2, -2, "Menu", "", 30, "FastNights");
      else Buttons.NewButton(10, 340, 30, 30, -2, -2, "Active", "", 30, "FastNights");
      if (!GameData.Blind)
        Buttons.NewButton(332, 160, 30, 30, -2, -2, "Menu", "", 30, "Blind");
      else Buttons.NewButton(332, 160, 30, 30, -2, -2, "Active", "", 30, "Blind");
      if (GameData.DoubleJabi === 1)
        Buttons.NewButton(332, 250, 30, 30, -2, -2, "Menu", "", 30, "DoubleJabi");
      else
        Buttons.NewButton(332, 250, 30, 30, -2, -2, "Active", "", 30, "DoubleJabi");
      if (GameData.DoubleVirus === 2)
        Buttons.NewButton(332, 340, 30, 30, -2, -2, "Menu", "", 30, "DoubleVirus");
      else
        Buttons.NewButton(332, 340, 30, 30, -2, -2, "Active", "", 30, "DoubleVirus");

      Buttons.NewButton(430, 395, 200, 75, -3, 2, "Menu", "Night 7", 50, "CN");
      Buttons.NewButton(10, 82, 50, 50, -3, -3, "Menu", "<", 50, "FearFactor");
      Buttons.NewButton(140, 82, 50, 50, -3, -3, "Menu", ">", 50, "FearFactor");
      Buttons.NewButton(10, 162, 50, 50, -3, -3, "Menu", "<", 50, "JabiDiff");
      Buttons.NewButton(140, 162, 50, 50, -3, -3, "Menu", ">", 50, "JabiDiff");
      Buttons.NewButton(10, 242, 50, 50, -3, -3, "Menu", "<", 50, "VirusDiff");
      Buttons.NewButton(140, 242, 50, 50, -3, -3, "Menu", ">", 50, "VirusDiff");
      Buttons.NewButton(10, 317, 50, 50, -3, -3, "Menu", "", 30, "Endless");

      new Input(Ctx, Buttons, GameData, Images);
    </script>
