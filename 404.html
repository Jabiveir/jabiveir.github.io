<body style="background-color: #dfe">
  <h1>Error 404</h1>
  <span>
    Whoops! Looks like the page/file for this link doesn't exist.<br>
    Click <a href="https://jabiveir.com">here</a> to return to the main site page.
  </span><br><br>
  <img src="./Assets/Oops.png">
  <script>
    let Ach;
    let name = "Ach=";
    let ca = decodeURIComponent(document.cookie).split(";");
    for (let i = 0; i < ca.length; i++) {
      let c = ca[i];
      while (c.charAt(0) === " ") {c = c.substring(1);}
      if (c.indexOf(name) === 0) Ach = c.substring(name.length, c.length);
    }
    if(Ach[17] === "0") {
      Ach = Ach.slice(0, 17) + "1" + Ach.slice(17+1);
      let d = new Date();
      d.setTime(d.getTime() + 365 * 24 * 60 * 60 * 1000);
      document.cookie = "Ach=" + Ach + ";expires=" + d.toUTCString() + ";path=/";
      alert("Achievement unlocked!\n'Not Found'");
    }
  </script>
</body>
